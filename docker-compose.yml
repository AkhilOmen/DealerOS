x-app-env: &app-env
  POSTGRES_HOST: postgres        # container name, not localhost
  POSTGRES_PORT: "5432"          # port inside the network (the host uses 5433)
  MQ_HOST: rabbitmq
  INTERNAL_CLIENT_ID: 46e3210d-94ec-465b-9566-c60c5779efdc
  INTERNAL_CLIENT_SECRET: jeJGK2e3Mb6Yc0IH2GXR_vylYTN4uLPC6LDL9rjAsEU

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealeros
      POSTGRES_PASSWORD: dealeros
      POSTGRES_DB: dealeros
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealeros -d dealeros"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (dealeros / dealeros)
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies app/db/migration/<version>/V<version>__N.postgresql-db-script.sql in version order
  # (same Flyway convention as CGF common-library). Never edit a released file; add a new version.
  migrate:
    image: flyway/flyway:11-alpine
    command:
      - -url=jdbc:postgresql://postgres:5432/dealeros
      - -user=dealeros
      - -password=dealeros
      - -schemas=dealeros
      - -locations=filesystem:/flyway/sql
      - -connectRetries=10
      - migrate
    volumes:
      - ./app/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["python", "-m", "app.api.main"]
    environment: *app-env
    ports:
      - "8000:8000"   # http://localhost:8000/docs
    volumes:
      - ./data/incoming:/dealeros/data/incoming   # shared with the consumer (and the host CLI)
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    build: .
    command: ["python", "-m", "app.consumer.main"]
    environment: *app-env
    volumes:
      - ./data/incoming:/dealeros/data/incoming
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
